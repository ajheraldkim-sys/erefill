name: erefill
description: "Water Refilling Management for CarCanMadCarLan"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- CORE DATABASE & AUTH ---
  supabase_flutter: ^2.8.0

  # --- SOCIAL AUTH ---
  google_sign_in: ^6.2.1

  # --- OPEN STREET MAP TOOLS ---
  flutter_map: ^7.0.2 # The engine for OSM
  latlong2: ^0.9.1 # For coordinates (Lat/Lng)
  geolocator: ^13.0.1 # To track Riders in real-time

  # --- STATE MANAGEMENT ---
  provider: ^6.1.2
  image_picker: ^1.0.7
  flutter_staggered_grid_view: ^0.7.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  path: ^1.9.1
  screenshot: ^3.0.0
  path_provider: ^2.1.5
  uuid: ^4.3.3
  signature: ^5.5.0
  pdf: ^3.11.1
  printing: ^5.11.1

  # --- DELIVERY MANAGEMENT MODULE ---
  sqflite: ^2.3.3+1          # offline-first SQLite storage
  fl_chart: ^0.70.2          # bar charts for reports
  connectivity_plus: ^6.1.1  # network state for sync trigger

  lottie: ^3.3.1

  # --- UI / BRANDING ---
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  go_router: ^17.2.3
  shadcn_flutter: ^0.0.55
  shadcn_flutter_material: ^0.0.54
  flutter_local_notifications: ^22.3.1
  flutter_displaymode: ^0.7.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app-icon.png"
  adaptive_icon_background: "#2196F3"
  adaptive_icon_foreground: "assets/icon/app-icon.png"
  min_sdk_size: 21

flutter_native_splash:
  color: "#0A0F1A"
  image: "assets/images/splash_wordmark.png"
  color_dark: "#0A0F1A"
  image_dark: "assets/images/splash_wordmark.png"
  android_12:
    image: "assets/images/splash_wordmark_android12.png"
    icon_background_color: "#0A0F1A"
    color: "#0A0F1A"

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/icon/
    - assets/images/
    - assets/fonts/
    - assets/payment/
